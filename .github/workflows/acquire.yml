name: Acquire

# Scheduled streamflow acquisition on GitHub Actions.
#
# The canonical DuckDB store is kept as an asset on a single "db-snapshot"
# GitHub Release. Each run downloads it, fetches one tier, re-uploads it, then
# checks health for that tier and alerts (via a GitHub issue) on failure.
#
# NOTE: only the WEEKLY tier runs on schedule here — the daily cron was removed
# so acquisition runs on a low cadence and the health-alert issue (opened only on
# degraded/errored connectors) is the signal, not routine daily runs. The daily,
# hourly, and realtime tiers are still available on demand via "Run workflow"
# (the realtime/hourly tiers re-upload the ~700 MB DB too often for a schedule and
# belong on a long-lived host anyway).

on:
  schedule:
    - cron: "0 3 * * 0"    # weekly Sun 03:00 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to fetch"
        type: choice
        default: daily
        options: [realtime, hourly, daily, weekly]
      providers:
        description: "Optional space-separated provider slugs (overrides tier for the fetch)"
        type: string
        default: ""
      lookback:
        description: "Optional lookback hours for a providers= dispatch (e.g. 460000 to backfill a frozen archive)"
        type: string
        default: ""

# One acquisition at a time — concurrent runs would race the shared DB asset.
concurrency:
  group: csfs-acquire
  cancel-in-progress: false

permissions:
  contents: write   # upload the DB asset to the release
  issues: write     # open/update the health-alert issue

env:
  DB_TAG: db-snapshot
  DB_FILE: csfs.duckdb
  DB_ARCHIVE: csfs.duckdb.zst

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[api,geo]"

      - name: Select tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
          else
            # The only cron on this workflow is the weekly one. Do NOT match
            # on the cron string: delayed schedule events historically fell
            # through a string comparison here and silently ran the daily
            # tier instead.
            echo "tier=weekly" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore DB snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$DB_TAG" --pattern "$DB_ARCHIVE" --clobber 2>/dev/null; then
            zstd -T0 -d --force "$DB_ARCHIVE" -o "$DB_FILE"
            echo "Restored compressed $DB_FILE ($(du -h "$DB_FILE" | cut -f1))"
          elif gh release download "$DB_TAG" --pattern "$DB_FILE" --clobber 2>/dev/null; then
            echo "Restored $DB_FILE ($(du -h "$DB_FILE" | cut -f1))"
          else
            echo "No existing snapshot — starting a fresh DB."
          fi

      - name: Fetch tier ${{ steps.tier.outputs.tier }}
        # Bound each cycle: some connectors have thousands of stations (e.g.
        # Brazil ANA ~17.6k), and an unbounded run iterates them all every time,
        # taking far too long. MAX_STATIONS caps stations per connector per
        # cycle. (Today the runner takes the first N; rotating coverage across
        # runs is a future improvement.)
        env:
          MAX_STATIONS: "500"
          CONCURRENCY: "12"
          PROVIDERS: ${{ inputs.providers }}
          LOOKBACK: ${{ inputs.lookback }}
          # Optional repo secret; norway_nve reads it as its HydAPI key
          # (register free at https://hydapi.nve.no/).
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
          # CI-specific provider config: dataset auto-downloads disabled
          # (they exhaust the runner's disk), southafrica_dws mirror.
          CSFS_CONFIG: .github/csfs-ci.yaml
        run: |
          df -h / | tail -1
          if [ -n "$PROVIDERS" ]; then
            ARGS=""
            for p in $PROVIDERS; do ARGS="$ARGS -p $p"; done
            [ -n "$LOOKBACK" ] && ARGS="$ARGS --lookback $LOOKBACK"
            csfs --config "$CSFS_CONFIG" fetch $ARGS \
              --max-stations "$MAX_STATIONS" --concurrency "$CONCURRENCY"
          else
            csfs --config "$CSFS_CONFIG" fetch --tier "${{ steps.tier.outputs.tier }}" \
              --max-stations "$MAX_STATIONS" --concurrency "$CONCURRENCY"
          fi
          df -h / | tail -1

      - name: Save DB snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$DB_TAG" >/dev/null 2>&1 \
            || gh release create "$DB_TAG" --title "DB snapshot" \
                 --notes "Rolling canonical CSFS DuckDB store (updated by Acquire)."
          # Primary-key indexes can push the operational DuckDB above GitHub's
          # 2 GiB per-asset limit. Keep the local database uncompressed while
          # acquiring, then publish a zstd snapshot for subsequent runs.
          zstd -T0 -3 --force "$DB_FILE" -o "$DB_ARCHIVE"
          gh release upload "$DB_TAG" "$DB_ARCHIVE" --clobber

      - name: Health report
        id: health
        run: |
          csfs health --tier "${{ steps.tier.outputs.tier }}" | tee health.txt
          csfs health --tier "${{ steps.tier.outputs.tier }}" --json \
            --fail-on error,degraded > health.json || true
          # Alert only on acquisition runs that errored/degraded this cycle.
          if csfs health --tier "${{ steps.tier.outputs.tier }}" \
               --degraded-only --fail-on error,degraded; then
            echo "degraded=false" >> "$GITHUB_OUTPUT"
          else
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          fi
          status=$(python -c 'import json; print(json.load(open("health.json"))["status"])')
          degraded=$(python -c 'import json; print(len(json.load(open("health.json"))["degraded"]))')
          {
            echo "## CSFS ${status}: ${{ steps.tier.outputs.tier }} tier"
            echo
            echo "Connectors requiring attention: **${degraded}**"
            echo
            echo '```json'
            python -c 'import json; d=json.load(open("health.json")); print(json.dumps({"summary": d["summary"], "reasons": d["reasons"]}, indent=2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-${{ steps.tier.outputs.tier }}
          path: |
            health.txt
            health.json

      - name: Publish machine-readable status
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          asset="health-status-${TIER}.json"
          cp health.json "$asset"
          gh release upload "$DB_TAG" "$asset" --clobber

      - name: Alert on degraded connectors
        if: steps.health.outputs.degraded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          title="CSFS health alert: ${TIER} tier"
          body="One or more connectors in the **${TIER}** tier errored or degraded in the latest run ($(date -u +%Y-%m-%dT%H:%MZ)).

          <!-- csfs-recovery:0 -->

          \`\`\`
          $(cat health.txt)
          \`\`\`

          Root-cause groups:
          \`\`\`json
          $(python -c 'import json; print(json.dumps(json.load(open("health.json"))["reasons"], indent=2))')
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "health" --body "$body" \
              || gh issue create --title "$title" --body "$body"
          fi

      - name: Record recovery and close after two healthy runs
        if: steps.health.outputs.degraded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          title="CSFS health alert: ${TIER} tier"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          [ -z "$existing" ] && exit 0
          previous=$(gh issue view "$existing" --json comments \
            --jq '.comments[-1].body | contains("<!-- csfs-recovery:1 -->")')
          if [ "$previous" = "true" ]; then
            gh issue comment "$existing" --body "Health remained clean for a second consecutive run. Closing automatically.

          <!-- csfs-recovery:2 -->

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$existing" --reason completed
          else
            gh issue comment "$existing" --body "First consecutive healthy run observed. This alert will close if the next run is also healthy.

          <!-- csfs-recovery:1 -->

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      # The job is NOT failed when connectors degrade: in a real tier some
      # connector is almost always degraded (dead host, awaiting data, etc.), so
      # failing here would make every run red and train people to ignore it.
      # A successful acquisition that saved the snapshot is a success; degraded
      # connectors are surfaced via the alert issue and the health artifact.
      # The job still fails naturally if fetch or the snapshot upload errors.
